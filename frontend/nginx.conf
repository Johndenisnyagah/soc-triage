server {
    listen 80;
    root /usr/share/nginx/html;

    # The real upload cap. MAX_UPLOAD_BYTES in the API bounds the string it
    # holds, but by then the body is already spooled; the proxy is where a
    # cap stops the bytes arriving at all. Keep the two in step (50 MB).
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Client-side routes such as /incidents/INC-... resolve to the app.
    location / {
        try_files $uri /index.html;
    }
}

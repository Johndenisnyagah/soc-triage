name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No secrets are referenced anywhere in this file, and nothing here needs write
# access. The suite is offline by design: the ATT&CK catalog is committed at
# backend/data/attack_catalog.json and read from disk, and enrichment is off
# unless SOC_ENRICHMENT_ENABLED is set, which nothing below sets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint
        # Pinned so a new ruff release can't turn the build red with no code
        # change. Config lives in backend/ruff.toml.
        working-directory: backend
        run: |
          pip install ruff==0.17.2
          ruff check .

      - name: Run tests
        # conftest.py points DATABASE_URL at a throwaway SQLite file in a temp
        # directory before any app module is imported, so no service container
        # is needed here.
        working-directory: backend
        run: pytest -q

  backend-postgres:
    name: backend (pytest on Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soc
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: soc_triage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U soc -d soc_triage_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests against Postgres
        # TEST_DATABASE_URL, not DATABASE_URL: conftest only ever points the
        # suite at a real database when told to by this separately named
        # variable, and truncates every table between tests.
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://soc:ci-only@localhost:5432/soc_triage_test
        run: pytest -q

  compose:
    name: docker compose (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up --detach --build --wait db api web

      - name: Seed the sample logs
        run: docker compose run --rm seed

      - name: Check the UI serves the incidents through its proxy
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep '<div id="root">' > /dev/null
          curl -fsS http://127.0.0.1:8080/incidents/INC-fe9ac9b7 | grep '<div id="root">' > /dev/null
          curl -fsS http://127.0.0.1:8080/api/incidents | python3 -c '
          import json, sys
          ids = [i["incident_id"] for i in json.load(sys.stdin)]
          assert ids == ["INC-fe9ac9b7", "INC-27359b57"], ids
          print("incidents:", ids)'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  dependency-audit:
    name: dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        # Checks every resolved package against the PyPI advisory database
        # (OSV). Fails on any known vulnerability.
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit npm dependencies
        # Dev dependencies included: vite runs on a developer's machine, and
        # that machine is part of the attack surface too.
        working-directory: frontend
        run: npm audit --audit-level=high

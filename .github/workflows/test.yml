name: test

on:
  push:
    branches: [main, ci/github-actions]
  pull_request:
    branches: [main]

# No secrets are referenced anywhere in this file, and nothing here needs write
# access. The suite is offline by design: the ATT&CK catalog is committed at
# backend/data/attack_catalog.json and read from disk, and enrichment is off
# unless SOC_ENRICHMENT_ENABLED is set, which nothing below sets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        # conftest.py points DATABASE_URL at a throwaway SQLite file in a temp
        # directory before any app module is imported, so no service container
        # is needed here.
        working-directory: backend
        run: pytest -q

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
